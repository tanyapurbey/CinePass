spring.application.name=CinePass

# Server Port (Dynamic for Render / Railway / Heroku, defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Supabase / Neon / Local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinepass_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:x3GZiELH42WhDR9LpW9VEDpdaCDWc7lRxnpBVFIMt7A=}
jwt.expiration.ms=86400000

# Seat Lock Duration
booking.lock.duration.minutes=5

# CORS Allowed Origins (Comma-separated for multiple frontend domains)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
